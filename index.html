(function () {

  var isCoarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
    (navigator.maxTouchPoints > 0 && !(window.matchMedia && window.matchMedia('(pointer: fine)').matches));
  var isTouch = isCoarse || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (isCoarse && document.documentElement) document.documentElement.classList.add('touch');
  var viewScale = 1;
  var viewRot = 0;   // 0 = 正常；90 = 竖屏下整块顺时针旋转（手机）
  var PORTRAIT_Q = '(orientation: portrait) and (max-width: 920px) and (pointer: coarse)';

  // 依显示尺寸设置内部分辨率与 UI 字号（放大后仍清晰，UI 随之等比缩放）
  function fitView() {
    // 用布局尺寸（offsetWidth），不受 CSS transform 影响
    var lw = cvs.offsetWidth || cvs.clientWidth || W;
    var lh = cvs.offsetHeight || cvs.clientHeight || H;
    if (!lw || !lh) { lw = W; lh = H; }
    viewRot = (window.matchMedia && window.matchMedia(PORTRAIT_Q).matches) ? 90 : 0;
    var dpr = window.devicePixelRatio || 1;
    var cap = isTouch ? 2 : 2.5;                 // 手机限制到 2 倍，省 GPU
    var s = Math.min(cap, Math.max(1, lw / W * dpr));
    viewScale = s;
    cvs.width = Math.round(W * s);
    cvs.height = Math.round(H * s);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    if (appEl) appEl.style.fontSize = Math.max(9, Math.min(26, lw / W * 16)) + 'px';
    rebuildBackground(s);
  }

  var PAPER = '#f6efdd';
  var INK = '#241f1b';

    nc.putImageData(img, 0, 0);
  })();

    { t: '花间一壶酒，独酌无相亲', f: '李白·月下独酌' },
    { t: '醉里乾坤大，壶中日月长', f: '古谚' },
    { t: '绿蚁新醅酒，红泥小火炉', f: '白居易·问刘十九' },

    for (var i = 0; i < N; i++) { lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45; del[i] = lp; }
    var idx = 0;
    for (var n = 0; n < len; n++) {

  var bgLayer = null;

  // ============ 绘制：瞄准辅助 ============
  function drawAimGuide() {
    if (S.scene !== 'play') return;
    if (S.phase !== 'aim' && S.phase !== 'charge') return;
    var a = S.angle;
    var pts = [];
    var v = V_MIN + (S.phase === 'charge' ? S.power : 0.55) * (V_MAX - V_MIN);
    var px = LAUNCH.x, py = LAUNCH.y, vx = v * Math.cos(a), vy = -v * Math.sin(a);
    var hitPot = false;
    for (var i = 0; i < 130; i++) {
      var dt = 0.025;
      px += vx * dt; py += vy * dt; vy += G * dt; vx += S.wind * dt;
      if (py > GROUND || px > W) break;
      if (Math.abs(px - S.potX) < S.potMouth / 2 && py > potMouthY() - 4) hitPot = true;
      pts.push([px, py]);
    }
    ctx.save();
    ctx.setLineDash([4, 7]); ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(184,53,44,' + (S.phase === 'charge' ? .62 : .38) + ')';
    ctx.beginPath();
    ctx.moveTo(LAUNCH.x, LAUNCH.y);
    for (var j = 0; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
    ctx.stroke();
    ctx.setLineDash([]);
    if (pts.length) {
      var lp = pts[pts.length - 1];
      ctx.beginPath();
      ctx.arc(lp[0], lp[1], hitPot ? 9 : 5.5, 0, 6.29);
      ctx.strokeStyle = hitPot ? 'rgba(74,124,89,.9)' : 'rgba(184,53,44,.55)';
      ctx.lineWidth = 2; ctx.stroke();

    // 角度弧
    ctx.strokeStyle = 'rgba(61,107,142,.5)'; ctx.lineWidth = 1.4;

    ctx.restore();
  }

  // ============ 绘制：粒子与花瓣 ============
  function drawParticles() {
    for (var i = 0; i < S.particles.length; i++) {
      var p = S.particles[i];
      if (p.ripple) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life) * .7;
        ctx.strokeStyle = p.c; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r + (1 - p.life) * 26, 0, 6.29); ctx.stroke();
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = clamp(p.life, 0, 1);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
        ctx.restore();
      }
    }
    // 花瓣
    for (var k = 0; k < S.petals.length; k++) {
      var q = S.petals[k];
      ctx.save();
      ctx.globalAlpha = q.a;
      ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillStyle = '#c98c92';
      ctx.beginPath(); ctx.ellipse(0, 0, q.s * 1.7, q.s * 0.85, 0, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  // ============ 更新 ============
  function update(dt, t) {
    // 壶上下浮动
    if (S.potBobAmp > 0) S.potBob = Math.sin(t * 0.0011 * (1 + S.level * 0.08)) * S.potBobAmp;
    else S.potBob = 0;

    // 花瓣
    for (var k = 0; k < S.petals.length; k++) {
      var q = S.petals[k];
      q.x += (S.wind * 0.06 + Math.sin(t * 0.001 + q.ph) * 8) * dt;
      q.y += q.vy * dt;
      q.rot += dt * 0.8;
      if (q.y > H + 6) { q.y = -6; q.x = rnd(0, W); }
      if (q.x > W + 8) q.x = -8; if (q.x < -8) q.x = W + 8;
    }

    // 粒子
    for (var i = S.particles.length - 1; i >= 0; i--) {
      var p = S.particles[i];
      p.life -= p.decay * dt;
      if (!p.ripple) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      if (p.life <= 0) S.particles.splice(i, 1);
    }

    // 蓄力
    if (S.charging) {
      S.powerT += dt;
      S.power = 0.5 - 0.5 * Math.cos(S.powerT * Math.PI * 2 / 1.28);
    }

    // 飞行
    if (S.flying && S.arrow) {
      var a = S.arrow;
      var steps = 3, sdt = dt / steps;
      for (var s = 0; s < steps; s++) {
        var px = a.x, py = a.y;
        a.vy += G * sdt; a.vx += S.wind * sdt;
        a.x += a.vx * sdt; a.y += a.vy * sdt;
        a.ang = Math.atan2(a.vy, a.vx);

        var my = potMouthY();
        var tipX = a.x, tipY = a.y;
        // 穿过壶口平面
        if (py < my && tipY >= my) {
          var dx = tipX - S.potX;
          var halfM = S.potMouth / 2;
          if (Math.abs(dx) <= halfM) {
            onHit(dx, halfM, my);
            return;
          } else if (Math.abs(dx) <= halfM + 12) {
            onRim(dx, my);
            return;
          }
        }
        // 撞壶身
        if (tipY > my && tipY < GROUND && Math.abs(tipX - S.potX) < 28) {
          a.vx = -a.vx * 0.32; a.vy *= 0.4;
          a.x = S.potX + (dx2(a) > 0 ? 28 : -28);
          sfxRim(); burst(a.x, a.y, '#7d8b80', 8, 130);
        }
        // 落地
        if (tipY >= GROUND) {
          a.y = GROUND; a.dead = true;
          if (Math.abs(a.x - S.potX) < 34) { /* 落壶边 */ }
          S.stuck.push({ x: a.x, y: GROUND, ang: clamp(a.ang, 0.35, 1.35) });
          burst(a.x, GROUND, '#9a8a6c', 9, 110, 300);
          sfxGround();
          onMiss();
          return;
        }
        // 出界
        if (a.x > W + 40 || a.x < -40 || a.y > H + 60) { onMiss(); return; }
      }
    }

    // 屏幕震动衰减
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 3);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.4);
  }

  function dx2(a) { return a.x > S.potX ? 1 : -1; }

  function onHit(dx, halfM, my) {
    S.flying = false; S.arrow = null;
    var perfect = Math.abs(dx) < halfM * 0.32;
    S.combo++; if (S.combo > S.bestCombo) S.bestCombo = S.combo;
    var mult = 1 + Math.min(S.combo - 1, 6) * 0.2;
    var base = 100 + Math.round(S.potX / 22);
    var gain = Math.round((base + (perfect ? 90 : 0)) * mult);
    S.score += gain; S.levelScore += gain;
    S.settles++; if (perfect) S.perfects++;

    S.inPot.push({ ang: rnd(-0.22, 0.22) });
    if (S.inPot.length > 8) S.inPot.shift();
    S.lastGoodPower = S.lastPower;

    ripple(S.potX, my);
    burst(S.potX, my, perfect ? '#d8a33a' : '#7d8b80', perfect ? 22 : 12, perfect ? 200 : 130, 260);
    S.shake = perfect ? 0.5 : 0.26;
    S.flash = perfect ? 0.55 : 0.25;

    if (perfect) { sfxPerfect(); toast('正中 · ' + gain, '#d8a33a'); }
    else { sfxHit(); toast('入壶 · ' + gain, CINNABAR); }
    if (S.combo >= 2) { sfxCombo(S.combo); setTimeout(function () { toast('连中 ' + S.combo + ' 箭', '#3d6b8e'); }, 420); }
    showPoem();
    updateHud();
    endShot();
  }

  function onRim(dx, my) {
    S.flying = false; S.arrow = null;
    S.combo = 0;
    burst(S.potX + (dx > 0 ? S.potMouth / 2 : -S.potMouth / 2), my - 10, '#7d8b80', 10, 150, 400);
    sfxRim();
    toast('擦口而过', '#6b5b45');
    S.shake = 0.2;
    updateHud();
    endShot();
  }

  function onMiss() {
    S.flying = false; S.arrow = null;
    S.combo = 0;
    updateHud();
    endShot();
  }

  // ============ 主渲染 ============
  function render(t) {
    ctx.save();
    if (S.shake > 0) ctx.translate(rnd(-1, 1) * S.shake * 7, rnd(-1, 1) * S.shake * 5);

    drawBackground(t);

    // 落地的箭
    for (var i = 0; i < S.stuck.length; i++) {
      var s = S.stuck[i];
      ctx.save();       ctx.translate(s.x, s.y); ctx.rotate(s.ang);
      drawArrowShape(0, 0, 32, 1, false);
      ctx.restore();
    }

    drawPot(t);
    drawArcher(t);
    drawAimGuide();

    if (S.arrow && S.flying) {
      ctx.save();
      ctx.translate(S.arrow.x, S.arrow.y); ctx.rotate(S.arrow.ang);
      drawArrowShape(0, 0, 34, 1, false);
      ctx.restore();
    }

    drawParticles();
    drawPowerBar();

    // 命中闪光
    if (S.flash > 0) {
      ctx.save(); ctx.globalAlpha = S.flash * 0.35;
      ctx.fillStyle = '#fff6e0'; ctx.fillRect(0, 0, W, H); ctx.restore();
    }

    // 蓄力提示
    if (S.scene === 'play' && S.phase === 'aim' && S.level === 1 && S.arrowsLeft === 6) {
      ctx.save();
      ctx.fillStyle = 'rgba(36,31,27,.7)'; ctx.font = '16px "STKaiti",serif'; ctx.textAlign = 'center';
      ctx.fillText('按住蓄力 · 松手投箭', W / 2, GROUND + 40);
      ctx.restore();
    }
    ctx.restore();
  }

  // ============ 主循环 ============
  var last = 0;
  function loop(ts) {
    var dt = Math.min(0.033, (ts - last) / 1000 || 0);
    last = ts;
    if (S.scene === 'play') update(dt, ts);
    else { // 菜单/结算时也保持环境动效
      for (var k = 0; k < S.petals.length; k++) {
        var q = S.petals[k];
        q.x += Math.sin(ts * 0.001 + q.ph) * 8 * dt;
        q.y += q.vy * dt; q.rot += dt * 0.8;
        if (q.y > H + 6) { q.y = -6; q.x = rnd(0, W); }
      }
      for (var i = S.particles.length - 1; i >= 0; i--) {
        var p = S.particles[i]; p.life -= p.decay * dt;
        if (!p.ripple) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
        if (p.life <= 0) S.particles.splice(i, 1);
      }
      if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 3);
      if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.4);
    }
    render(ts);
    requestAnimationFrame(loop);
  }

  // ============ 输入 ============
  // 屏幕坐标 → 画布坐标（兼容手机竖屏下整块旋转 90° 的情况）
  function toCanvas(e) {
    var r = cvs.getBoundingClientRect();
    if (viewRot === 90) {
      // 顺时针旋转 90°：局部偏移 (lx,ly) → 屏幕偏移 (-ly, lx)
      // 故其逆变换为 lx = dy, ly = -dx；旋转后 bbox 宽高互换
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var lw = r.height, lh = r.width;          // 旋转前的布局尺寸
      return { x: (dy + lw / 2) * W / lw, y: (-dx + lh / 2) * H / lh };
    }
    return {
      x: (e.clientX - r.left) * W / r.width,
      y: (e.clientY - r.top) * H / r.height
    };
  }
  function setAim(p) {
    var dx = p.x - LAUNCH.x, dy = LAUNCH.y - p.y;
    var a = Math.atan2(Math.max(dy, 4), Math.max(dx, 8));
    S.angle = clamp(a, 8 * Math.PI / 180, 82 * Math.PI / 180);
  }
  var activePointer = null;                     // 多指同按时只认先落下的那根
  cvs.addEventListener('pointermove', function (e) {
    if (S.scene !== 'play') return;
    if (activePointer !== null && e.pointerId !== activePointer) return;
    if (S.phase === 'aim' || S.phase === 'charge') setAim(toCanvas(e));
  });
  cvs.addEventListener('pointerdown', function (e) {
    if (S.scene !== 'play' || S.phase !== 'aim') return;
    if (activePointer !== null) return;
    e.preventDefault();
    activePointer = e.pointerId;
    setAim(toCanvas(e));
    S.charging = true; S.powerT = 0; S.power = 0; S.phase = 'charge';
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
  });
  cvs.addEventListener('pointerup', function (e) {
    if (activePointer !== null && e.pointerId !== activePointer) return;
    activePointer = null;
    if (S.scene !== 'play' || S.phase !== 'charge') return;
    e.preventDefault();
    S.charging = false;
    launch();
  });
  cvs.addEventListener('pointercancel', function (e) {
    if (activePointer !== null && e.pointerId !== activePointer) return;
    activePointer = null;
    if (S.phase === 'charge') { S.charging = false; S.phase = 'aim'; }
  });
  cvs.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (S.scene === 'menu') { startGame(); return; }
      if (S.scene === 'levelEnd') { nextLevel(); return; }
      if (S.scene === 'over') { startGame(); return; }
      if (S.scene === 'play' && S.phase === 'aim') {
        S.charging = true; S.powerT = 0; S.power = 0; S.phase = 'charge'; initAudio();
      }
    }
    if (e.code === 'ArrowUp') { S.angle = clamp(S.angle + 0.015, 0.14, 1.43); e.preventDefault(); }
    if (e.code === 'ArrowDown') { S.angle = clamp(S.angle - 0.015, 0.14, 1.43); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' && S.scene === 'play' && S.phase === 'charge') {
      S.charging = false; launch();
    }
  });

  // ============ 流程 ============
  function startGame() {
    if (S.scene === 'play') return;
    initAudio();
    startBgm();
    S.score = 0; S.combo = 0; S.bestCombo = 0;
    S.particles = [];
    setupLevel(1);
    S.scene = 'play';
    el('ovStart').classList.add('hidden');
    el('ovEnd').classList.add('hidden');
    el('ovLevel').classList.add('hidden');
  }
  function nextLevel() {
    if (S.scene !== 'levelEnd') return;
    S.scene = 'play';
    setupLevel(S.level + 1);
    el('ovLevel').classList.add('hidden');
  }
  el('btnStart').addEventListener('click', startGame);
  el('btnNext').addEventListener('click', nextLevel);
  el('btnRetry').addEventListener('click', startGame);
  el('btnMute').addEventListener('click', function () {
    S.muted = !S.muted;
    el('btnMute').textContent = S.muted ? '静' : '音';
    el('btnMute').className = S.muted ? 'seal' : 'seal ink';
    if (masterGain) masterGain.gain.value = S.muted ? 0 : 1;
    if (S.muted) stopBgm(); else if (S.scene !== 'menu') startBgm();
  });

  // ============ 启动 ============
  loadMeta();
  el('bestScore').textContent = S.best;
  el('poemCount').textContent = S.poemN;
  setupLevel(1);
  S.scene = 'menu';
  fitView();
  var fitTimer = null;
  function refit(delay) {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitView, delay || 120);
  }
  window.addEventListener('resize', function () { refit(120); });
  window.addEventListener('orientationchange', function () {
    refit(60); setTimeout(fitView, 300); setTimeout(fitView, 800);
  });
  // 手机地址栏收放 / 软键盘：visualViewport 变化
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { refit(120); });
  }
  // 首次触摸即解锁音频（iOS 要求音频在用户手势内启动）
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (t) {
    window.addEventListener(t, function () {
      initAudio();
      if (AC && AC.state === 'suspended') AC.resume();
    }, { once: true, passive: true });
  });
  // 切走标签页时停乐，回来续奏
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopBgm();
      else if (!S.muted && S.scene !== 'menu') startBgm();
    });
  }
  setTimeout(fitView, 200);   // 字体加载后再校正一次
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
